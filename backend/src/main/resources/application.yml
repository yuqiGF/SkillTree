spring:
  application:
    name: skilltree
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/skilltree?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
server:
  port: ${PORT:8080}
  address: ${HOST:127.0.0.1}
  error:
    include-message: never
app:
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
---
spring:
  config:
    activate:
      on-profile: sqlite
  datasource:
    url: ${DB_URL:jdbc:sqlite:./data/skilltree.db}
    username: ''
    password: ''
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      schema-locations: classpath:schema-sqlite.sql
