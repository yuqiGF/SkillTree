# NAT forwards public 21573 -> 80 and public 54432 -> 443.
# Bind the private network address because unrelated SSH forwards use loopback port 443.
server {
    listen 172.16.0.23:80;
    server_name yuqiqi.love;
    return 301 https://yuqiqi.love:54432$request_uri;
}

server {
    listen 172.16.0.23:443 ssl http2;
    server_name yuqiqi.love;

    ssl_certificate /etc/letsencrypt/live/yuqiqi.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuqiqi.love/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
